name: Foodgram CI/CD

on:
  push:
    branches: [ master, main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install flake8
      - name: Lint with flake8
        run: |
          cd backend
          flake8 . --exclude=venv,migrations --ignore=E501,F401,F403,F405

  build_and_push:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push backend
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.production.yml,infra/nginx.conf"
          target: "/home/${{ secrets.SERVER_USER }}/foodgram/"
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/foodgram/
            sudo docker compose -f docker-compose.production.yml pull backend
            sudo docker compose -f docker-compose.production.yml up -d --build
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py load_data
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput